[package]
name = "cfbench"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
description = "An unofficial native Cloudflare-compatible speed test CLI"
license = "MIT"
repository = "https://github.com/fcendesu/cfbench"
keywords = ["cloudflare", "network", "speedtest", "cli"]
categories = ["command-line-utilities", "network-programming"]

[package.metadata.deb]
maintainer = "cfbench contributors"
copyright = "2026, cfbench contributors"
license-file = ["LICENSE", "0"]
extended-description = "A native command-line speed test against Cloudflare's speed-test endpoints."
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/cfbench", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/cfbench/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/cfbench/changelog", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/cfbench", dest = "/usr/bin/cfbench", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/cfbench/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/cfbench/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/cfbench/LICENSE", mode = "644", doc = true },
]
license = "MIT"
release = "1"

[dependencies]
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
humantime = "2.4.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
# `arbitrary_precision` keeps values such as 1e400 syntactically valid until
# tolerant metadata leaf conversion. `raw_value` lets the bounded metadata
# decoder retain selected leaves while serde_json skips deep unknown values
# with its iterative ignored-value scanner instead of building a recursive Value.
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tokio = { version = "1.49", features = ["test-util"] }
