[package]
name = "cfbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An unofficial native Cloudflare-compatible speed test CLI"
license = "MIT"
repository = "https://github.com/fcendesu/cfbench"
keywords = ["cloudflare", "network", "speedtest", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
bytes = "1.11"
futures-util = "0.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
