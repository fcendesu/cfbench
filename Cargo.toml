[package]
name = "cfbench"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "An unofficial native Cloudflare-compatible speed test CLI"
readme = "README.md"
license = "MIT"
repository = "https://github.com/fcendesu/cfbench"
keywords = ["cloudflare", "network", "speedtest", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    ".github/",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "scripts/",
    "tests/install_script.sh",
    "tests/package_standalone.sh",
    "tests/plan_compatibility.rs",
    "tests/release_artifacts.sh",
    "tests/repository_workflows.rs",
]

[package.metadata.deb]
maintainer = "cfbench contributors"
copyright = "2026, cfbench contributors"
license-file = ["LICENSE", "0"]
extended-description = "A native command-line speed test against Cloudflare's speed-test endpoints."
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/cfbench", "usr/bin/", "755"],
    ["assets/completions/cfbench.bash", "usr/share/bash-completion/completions/cfbench", "644"],
    ["assets/completions/_cfbench", "usr/share/zsh/vendor-completions/_cfbench", "644"],
    ["assets/completions/cfbench.fish", "usr/share/fish/vendor_completions.d/cfbench.fish", "644"],
    ["assets/man/cfbench.1", "usr/share/man/man1/cfbench.1", "644"],
    ["README.md", "usr/share/doc/cfbench/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/cfbench/changelog", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/cfbench", dest = "/usr/bin/cfbench", mode = "755" },
    { source = "assets/completions/cfbench.bash", dest = "/usr/share/bash-completion/completions/cfbench", mode = "644" },
    { source = "assets/completions/_cfbench", dest = "/usr/share/zsh/site-functions/_cfbench", mode = "644" },
    { source = "assets/completions/cfbench.fish", dest = "/usr/share/fish/vendor_completions.d/cfbench.fish", mode = "644" },
    { source = "assets/man/cfbench.1", dest = "/usr/share/man/man1/cfbench.1", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cfbench/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/cfbench/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/cfbench/LICENSE", mode = "644", doc = true },
]
license = "MIT"
release = "1"

[dependencies]
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
futures-util = "0.3"
humantime = "2.4.0"
indicatif = { version = "0.18", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
# `arbitrary_precision` keeps values such as 1e400 syntactically valid until
# tolerant metadata leaf conversion. `raw_value` lets the bounded metadata
# decoder retain selected leaves while serde_json skips deep unknown values
# with its iterative ignored-value scanner instead of building a recursive Value.
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
serde_yaml = "0.9"
tokio = { version = "1.49", features = ["test-util"] }
