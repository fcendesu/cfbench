[package]
name = "cfbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An unofficial native Cloudflare-compatible speed test CLI"
license = "MIT"
repository = "https://github.com/fcendesu/cfbench"
keywords = ["cloudflare", "network", "speedtest", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
