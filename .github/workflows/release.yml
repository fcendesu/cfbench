name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-22.04

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

  build-linux-x86_64:
    name: Linux x86_64 packages
    needs: verify-source
    runs-on: ubuntu-22.04

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release
      - name: Verify binary version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          reported=$(target/release/cfbench --version)
          case "$reported" in
            "cfbench $version "*) ;;
            *) printf 'unexpected version output: %s\n' "$reported" >&2; exit 1 ;;
          esac
      - name: Install package builders
        run: |
          cargo install --locked cargo-deb
          cargo install cargo-generate-rpm
      - name: Build Linux packages and archive
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cargo deb --no-build --no-strip
          cargo generate-rpm
          mkdir dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          tar -C target/release -czf "dist/cfbench-$tag-x86_64-unknown-linux-gnu.tar.gz" cfbench
      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-standalone:
    name: ${{ matrix.name }} standalone
    needs: verify-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Verify native Rust host
        shell: bash
        run: |
          rustc -vV | grep -F "host: ${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --locked --release
      - name: Verify and archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          reported=$(target/release/cfbench --version)
          case "$reported" in
            "cfbench $version "*) ;;
            *) printf 'unexpected version output: %s\n' "$reported" >&2; exit 1 ;;
          esac
          mkdir dist
          tar -C target/release -czf "dist/cfbench-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" cfbench
      - name: Verify and archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $reported = & target/release/cfbench.exe --version
          if (-not $reported.StartsWith("cfbench $version ")) {
            throw "unexpected version output: $reported"
          }
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path target/release/cfbench.exe -DestinationPath "dist/cfbench-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-standalone]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate artifacts and write checksums
        run: sh scripts/assemble-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
