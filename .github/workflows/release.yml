name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Linux x86_64 packages
    runs-on: ubuntu-22.04

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Build release binary
        run: cargo build --locked --release
      - name: Install package builders
        run: |
          cargo install --locked cargo-deb
          cargo install cargo-generate-rpm
      - name: Build packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cargo deb --no-build --no-strip
          cargo generate-rpm
          mkdir dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          tar -C target/release -czf "dist/cfbench-${tag}-x86_64-unknown-linux-gnu.tar.gz" cfbench
          (
            cd dist
            sha256sum *.deb *.rpm "cfbench-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
              > "cfbench-${tag}-SHA256SUMS.txt"
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
