name: Cloudflare compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-compatibility-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Check pinned methodology baseline
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compare with Cloudflare Speedtest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_cloudflare_compatibility.py
