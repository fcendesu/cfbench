name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            primary: true
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            primary: false
          - name: macos-aarch64
            os: macos-15
            primary: false
          - name: macos-x86_64
            os: macos-15-intel
            primary: false
          - name: windows-x86_64
            os: windows-2025
            primary: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test installer routing
        if: runner.os == 'Linux'
        run: |
          sh tests/install_script.sh
          sh tests/package_standalone.sh
          sh tests/release_artifacts.sh
      - name: Test compatibility monitor
        if: matrix.primary
        run: python3 -m unittest tests/test_cloudflare_compatibility_monitor.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Check formatting
        if: matrix.primary
        run: cargo fmt --check
      - name: Run Clippy
        if: matrix.primary
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --locked --release
